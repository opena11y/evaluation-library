<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en-US" xml:lang="en-US">
  <head>
    <title>Meta Refresh Iframe 3 | Refresh Test Page</title>
    <META HTTP-EQUIV="CACHE-CONTROL" CONTENT="NO-CACHE">
    <META HTTP-EQUIV="CONTENT-TYPE" CONTENT="text/html; charset=UTF-8">
    <META HTTP-EQUIV="refresh" CONTENT="15;url=refresh-1-iframe.html">
    <link href="test.css" rel="stylesheet" type="text/css"/>
    <script src="refresh-timer.js"></script>
  </head>
  <body>
    <header>
      <div class="title">Evaluation Library Test Pages</div>
      <div><a href="index.html">All test pages</a></div>
    </header>


    <main>
      <h1>Meta Refresh <code>iframe</code> 3: <span id="timer-count">15</span> Seconds</h1>
    </main>


    <script type="module">
      import EvaluationLibrary from '../releases/opena11y-evaluation-library.js';

      console.log('Running opena11y evaluation library script');
      window.addEventListener('load', () => {
        let doc = document;
        let evalLibrary = new EvaluationLibrary();
        let evalResult  = evalLibrary.evaluateWCAG(doc, doc.title, doc.location.href);
      });
    </script>
  </body>
</html>
