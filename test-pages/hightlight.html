<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en-US" xml:lang="en-US">
  <head>
    <title>Hightlight Test | Refresh Test Page</title>
    <META HTTP-EQUIV="CACHE-CONTROL" CONTENT="NO-CACHE">
    <META HTTP-EQUIV="CONTENT-TYPE" CONTENT="text/html; charset=UTF-8">
    <link href="test.css" rel="stylesheet" type="text/css"/>
  </head>
  <body id="h1">
    <header>
      <div class="title">Evaluation Library Test Pages</div>
      <div><a href="index.html">All test pages</a></div>
    </header>


    <main>
      <h1>Highlight Test: <span id="timer-count">30</span> seconds</h1>

        <iframe src="highlight-1-iframe.html" title="Highlight Test IFrame 1" width="100%" height="150"></iframe>

        <iframe src="highlight-2-iframe.html" title="Highlight Test IFrame 2" width="100%" height="150"></iframe>

        <iframe src="highlight-3-iframe.html" title="Highlight Test IFrame 3" width="100%" height="150"></iframe>

        <iframe src="refresh-3-iframe.html" title="Meta Refresh Test IFrame 3" width="100%" height="150"></iframe>

        <iframe src="highlight-1-iframe.html" title="Hidden iframe" width="100%" height="150" hidden></iframe>

    </main>




    <script type="module">
      import EvaluationLibrary from '../releases/opena11y-evaluation-library.js';

      console.log('Running opena11y evaluation library script');
      window.addEventListener('load', () => {
        let doc = document;
        let evalLibrary = new EvaluationLibrary();
        let evalResult  = evalLibrary.evaluateWCAG(doc, doc.title, doc.location.href);
      });
    </script>

  </body>
</html>
